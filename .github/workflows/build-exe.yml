name: Build Executable

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # permite rodar manualmente

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: |
          python -m PyInstaller --onefile --windowed --icon=logo.ico --name "DiagnosticoSistema-AnotaAI" gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiagnosticoSistema-AnotaAI
          path: dist/DiagnosticoSistema-AnotaAI.exe

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DiagnosticoSistema-AnotaAI.exe
          tag_name: v${{ github.run_number }}
          name: Build #${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
